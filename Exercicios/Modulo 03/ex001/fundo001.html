<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de imagem de fundo</title>
    <style>
        div.quadrado {
            display: inline-flex;
            border: 2px solid black;
            border-radius: 15px;
            width: 300px;
            height: 300px;
            background-color: rgb(127, 197, 255);
        }
        div#q1 {
            background-image: url(imagens/pattern002.png)
        }
        div#q2 {
            background-color: burlywood;
        }
        div#q3 {
            background-image: linear-gradient(to top, blue, green);
        }
        div.circulo {
            display: block;
            border: 2px solid black;
            border-radius: 500px;
            width: 500px;
            height: 500px;
        }
        div#c1 {
            background-image: url(imagens/pattern004.png);
        }
        div#c2 {
            background-image: linear-gradient(to top, purple, blue, orange);
        }
    </style>
</head>
<body>
    <div class="quadrado" id="q1">

    </div>
    <div class="quadrado" id="q2">

    </div>
    <div class="quadrado" id="q3">

    </div>
    <div class="circulo" id="c1">

    </div>
    <div class="circulo" id="c2">

    </div>
</body>
</html>
